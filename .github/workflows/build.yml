name: build

# PyInstaller cannot cross-compile, so each download is built on the system it targets.
# Every push builds and tests both; a tag starting with "v" also publishes them as a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The FFmpeg supplied with the Windows download: see packaging/fetch_ffmpeg_windows.py.
  FFMPEG_SOURCE_COMMIT: 946fcce07b6dcd0331c8cc609192aeff5e1924f8
  FFMPEG_VERSION: 9.0.2

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 rather than newer: a binary needs a C library at least as new as the
          # one it was built with, and 22.04's runs on more systems.
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: windows-latest
            label: windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries and a current FFmpeg for the tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 libfontconfig1 \
            libpulse0 libasound2
          # Ubuntu 22.04's own FFmpeg is 4.4; avOpenKit needs 6.0 or newer. This one is used
          # only to run the tests - the Linux download does not contain FFmpeg.
          curl -sSL -o ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz
          mkdir -p "$HOME/ffmpeg" && tar -xJf ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=1
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller

      - name: FFmpeg to supply with the Windows download
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python packaging/fetch_ffmpeg_windows.py
          echo "$GITHUB_WORKSPACE/packaging/ffmpeg-win" >> "$GITHUB_PATH"

      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: |
          ffmpeg -version | head -1
          python -m pytest -q

      # The program was developed on Linux. On Windows the tests are reported but do not stop
      # the build; the self-test of the packaged program below does.
      - name: Tests (Windows, reported only)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          ffmpeg -version | head -1
          python -m pytest -q -x --maxfail=25 -p no:cacheprovider

      - name: Build
        run: pyinstaller --clean --noconfirm avopenkit.spec

      - name: Self-test and package (Linux)
        if: runner.os == 'Linux'
        run: |
          ffmpeg -v error -f lavfi -i testsrc2=size=640x360:rate=30:duration=4 \
            -f lavfi -i sine=frequency=440:duration=4 -c:v libx264 -pix_fmt yuv420p -c:a aac clip.mp4
          ./dist/avOpenKit --version
          ./dist/avOpenKit --self-test clip.mp4
          cp dist/avOpenKit avOpenKit-linux-x86_64
          ls -la avOpenKit-linux-x86_64

      - name: Self-test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          packaging\ffmpeg-win\ffmpeg.exe -v error -f lavfi -i testsrc2=size=640x360:rate=30:duration=4 `
            -f lavfi -i sine=frequency=440:duration=4 -c:v libx264 -pix_fmt yuv420p -c:a aac clip.mp4
          # A windowed program has no console, so the self-test writes its report to a file.
          $env:AVOPENKIT_SELFTEST_REPORT = "$PWD\selftest.txt"
          $p = Start-Process -FilePath dist\avOpenKit\avOpenKit.exe `
                 -ArgumentList '--self-test', "$PWD\clip.mp4" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path selftest.txt -Pattern 'supplied with avOpenKit: True' -Quiet)) {
            throw "the packaged program did not use its own FFmpeg" }
          Compress-Archive -Path dist\avOpenKit -DestinationPath avOpenKit-windows-x64.zip
          Get-Item avOpenKit-windows-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: avOpenKit-${{ matrix.label }}
          path: |
            avOpenKit-linux-x86_64
            avOpenKit-windows-x64.zip
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The exact source of the FFmpeg inside the Windows download, hosted beside it.
      - name: FFmpeg source for the Windows download
        run: |
          curl -sSL -o "artifacts/ffmpeg-${FFMPEG_VERSION}-source.tar.gz" \
            "https://github.com/FFmpeg/FFmpeg/archive/${FFMPEG_SOURCE_COMMIT}.tar.gz"
          tar -tzf "artifacts/ffmpeg-${FFMPEG_VERSION}-source.tar.gz" | head -1
          cp docs/avOpenKit-User-Guide.pdf docs/avOpenKit-User-Guide-A5.pdf artifacts/
          cp packaging/THIRD-PARTY-NOTICES.md artifacts/
          (cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: packaging/RELEASE_NOTES.md
          files: artifacts/*
