[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avopenkit"
version = "0.1.0"
description = "Guided tasks over the FFmpeg command line: every task shows the command it runs."
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "Rajiv Tyagi" }]
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.gui-scripts]
avopenkit = "avopenkit.__main__:main"

[tool.setuptools.packages.find]
include = ["avopenkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
